<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0e0b09">
<title>BOA Marrakech</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0e0b09; --card:#1a1512; --card-2:#211a15; --text:#faf8f4; --muted:#c9beb2;
    --accent:#c8a96e; --accent-2:#8c7248; --accent-3:#e2c998; --on-accent:#171009;
    --accent-light:rgba(200,169,110,.14); --border:rgba(200,169,110,.2);
    --danger:#d97a5a; --today:rgba(143,191,154,.14); --today-text:#9fd3ab;
    --shadow: 0 1px 2px rgba(0,0,0,.35), 0 8px 22px rgba(0,0,0,.4);
    --font-display:'Cormorant Garamond', 'Montserrat', serif;
    --font-body:'Montserrat', -apple-system, Helvetica, Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0e0b09; --card:#1a1512; --card-2:#211a15; --text:#faf8f4; --muted:#c9beb2;
      --accent:#c8a96e; --accent-2:#8c7248; --accent-3:#e2c998; --on-accent:#171009;
      --accent-light:rgba(200,169,110,.14); --border:rgba(200,169,110,.2);
      --danger:#d97a5a; --today:rgba(143,191,154,.14); --today-text:#9fd3ab;
      --shadow: 0 1px 2px rgba(0,0,0,.45), 0 8px 24px rgba(0,0,0,.5);
    }
  }
  :root[data-theme="dark"]{
    --bg:#0e0b09; --card:#1a1512; --card-2:#211a15; --text:#faf8f4; --muted:#c9beb2;
    --accent:#c8a96e; --accent-2:#8c7248; --accent-3:#e2c998; --on-accent:#171009;
    --accent-light:rgba(200,169,110,.14); --border:rgba(200,169,110,.2);
    --danger:#d97a5a; --today:rgba(143,191,154,.14); --today-text:#9fd3ab;
    --shadow: 0 1px 2px rgba(0,0,0,.45), 0 8px 24px rgba(0,0,0,.5);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  body{background:var(--bg); color:var(--text); font-family:var(--font-body); -webkit-font-smoothing:antialiased;}
  .wrap{max-width:640px; margin:0 auto; transition:max-width .15s ease;
    padding-top:max(18px, env(safe-area-inset-top));
    padding-left:max(14px, env(safe-area-inset-left));
    padding-right:max(14px, env(safe-area-inset-right));
    padding-bottom:max(60px, env(safe-area-inset-bottom));
  }
  .wrap.wide{max-width:1440px;}

  .brand{display:flex; align-items:center; gap:12px; margin-bottom:2px;}
  .brand svg{flex-shrink:0; display:block;}
  h1{font-family:var(--font-display); font-weight:600; font-size:26px; letter-spacing:.5px; margin:0; color:var(--text); text-wrap:balance;}
  .sub{color:var(--accent); opacity:.85; font-size:10.5px; margin:3px 0 18px 47px; font-weight:600; text-transform:uppercase; letter-spacing:1.6px;}

  .tabs{display:flex; gap:7px; margin-bottom:18px;}
  .tab{flex:1; display:flex; flex-direction:column; align-items:center; gap:4px; text-align:center; padding:10px 4px 9px; border-radius:13px; background:var(--card); border:1px solid var(--border); font-size:11.5px; font-weight:600; color:var(--muted); cursor:pointer; transition:transform .15s ease, box-shadow .15s ease;}
  .tab svg{opacity:.75; transition:opacity .15s ease;}
  .tab.active{background:linear-gradient(155deg, var(--accent-3), var(--accent)); color:var(--on-accent); border-color:transparent; box-shadow:var(--shadow);}
  .tab.active svg{opacity:1;}
  .tab:active{transform:scale(.97);}

  .card{background:var(--card); border:1px solid var(--border); border-radius:16px; padding:17px; margin-bottom:14px; box-shadow:var(--shadow);}
  .card-title{font-weight:700; font-size:13.5px; margin-bottom:12px; display:flex; align-items:center; gap:7px; letter-spacing:.1px;}
  .card-title .dot{width:7px; height:7px; border-radius:50%; background:var(--accent); flex-shrink:0;}

  label{display:block; font-size:12px; font-weight:700; color:var(--muted); margin:14px 0 6px; text-transform:uppercase; letter-spacing:.4px;}
  label:first-child{margin-top:0;}
  input, select{width:100%; min-width:0; max-width:100%; padding:12px 12px; font-size:16px; font-family:var(--font-body); border:1.5px solid var(--border); border-radius:11px; background:var(--bg); color:var(--text); transition:border-color .15s ease, box-shadow .15s ease;}
  input[type="date"], input[type="time"]{-webkit-appearance:none; appearance:none;}
  /* iOS peint parfois ces champs 1-2px plus large que leur boîte CSS : on les enferme
     dans un cadre qui rogne tout débordement, plutôt que de compter sur width/max-width. */
  .field-clip{overflow:hidden; border-radius:11px;}
  .row2 > div{flex:1; min-width:0; overflow:hidden; border-radius:11px;}
  .nav .datepick{flex:1; min-width:0; text-align:center; overflow:hidden; border-radius:11px;}
  input:focus, select:focus{outline:none; border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-light);}
  .row2{display:flex; gap:10px;}

  .cat-list-wrap{margin-top:10px;}
  .cat-hint{font-size:11px; color:var(--muted); font-weight:600; margin-bottom:8px;}
  .cat-list{display:flex; flex-direction:column; gap:6px; max-height:260px; overflow-y:auto; padding-right:2px;}
  .cat-item{display:flex; align-items:center; gap:10px; padding:10px 12px; border:1.5px solid var(--border); border-radius:10px; background:var(--bg); font-size:12.5px; font-weight:600; cursor:pointer; transition:border-color .15s ease, background .15s ease;}
  .cat-check{width:16px; height:16px; border:1.5px solid var(--border); border-radius:4px; flex-shrink:0; position:relative;}
  .cat-item.selected .cat-check{background:var(--accent); border-color:var(--accent);}
  .cat-item.selected .cat-check::after{content:""; position:absolute; left:4px; top:1px; width:4px; height:8px; border:solid var(--on-accent); border-width:0 2px 2px 0; transform:rotate(45deg);}
  .cat-label{flex:1; min-width:0;}
  .cat-item .price{font-weight:800; color:var(--accent); flex-shrink:0; font-variant-numeric:tabular-nums;}
  .cat-count{flex-shrink:0; background:var(--accent); color:var(--on-accent); font-size:10px; font-weight:800; padding:2px 6px; border-radius:10px;}
  .cat-item.selected{border-color:var(--accent); background:var(--accent-light);}
  .cat-item.selected .price{color:var(--accent-3);}
  .cat-item.disabled{opacity:.45;}
  .cat-item:active{transform:scale(.98);}
  .cart{display:flex; flex-wrap:wrap; gap:6px; margin-top:10px;}
  .cart-chip{display:flex; align-items:center; gap:6px; background:var(--accent-light); color:var(--accent-3); border:1px solid var(--border); border-radius:20px; padding:6px 6px 6px 12px; font-size:11px; font-weight:700;}
  .cart-chip .x{cursor:pointer; width:16px; height:16px; border-radius:50%; background:var(--card-2); display:flex; align-items:center; justify-content:center; font-size:12px; line-height:1; color:var(--muted); flex-shrink:0;}
  .custom-add{display:flex; gap:8px; margin-top:10px;}
  .custom-add input[type="text"]{flex:2; min-width:0;}
  .custom-add input[type="number"]{flex:1; min-width:0;}
  .custom-add button{flex-shrink:0; padding:0 14px; border-radius:11px; border:1.5px solid var(--border); background:var(--bg); color:var(--accent); font-weight:700; font-size:12.5px; cursor:pointer; font-family:var(--font-body);}
  .reduc-row{display:flex; gap:8px;}
  .reduc-row input{flex:1; min-width:0;}
  .seg{display:flex; border:1.5px solid var(--border); border-radius:11px; overflow:hidden; flex-shrink:0;}
  .seg-btn{padding:0 15px; background:var(--bg); color:var(--muted); font-size:13px; font-weight:700; border:none; cursor:pointer; font-family:var(--font-body);}
  .seg-btn.active{background:var(--accent); color:var(--on-accent);}

  .cart-detailed{display:flex; flex-direction:column; gap:10px; margin-top:10px;}
  .cart-item{border:1.5px solid var(--border); border-radius:12px; padding:11px 12px; background:var(--bg);}
  .cart-item-head{display:flex; align-items:center; gap:8px; margin-bottom:8px;}
  .cart-item-label{flex:1; min-width:0; font-size:12.5px; font-weight:700;}
  .cart-item-price{font-weight:800; color:var(--accent); font-size:12.5px; flex-shrink:0; font-variant-numeric:tabular-nums;}
  .cart-item-head .x{cursor:pointer; width:18px; height:18px; border-radius:50%; background:var(--card-2); display:flex; align-items:center; justify-content:center; font-size:13px; color:var(--muted); flex-shrink:0;}
  .cart-item .mini-label{display:block; font-size:10px; font-weight:700; color:var(--muted); margin:8px 0 4px; text-transform:uppercase; letter-spacing:.3px;}
  .cart-item .mini-label:first-of-type{margin-top:0;}
  .cart-item select, .cart-item .row2{margin-bottom:0;}
  .reduc-row.mini{margin-top:8px;}
  .cart-total{text-align:right; font-size:12.5px; font-weight:800; color:var(--accent-3); margin-top:2px;}
  .cart-groups{margin-top:12px; padding:10px 12px; background:var(--accent-light); border:1.5px solid var(--border); border-radius:12px;}
  .cart-groups-hint{font-size:11px; font-weight:700; color:var(--accent-3); margin-bottom:7px; line-height:1.4;}
  .cart-group-row{display:flex; justify-content:space-between; gap:8px; font-size:11.5px; font-weight:600; color:var(--text); padding:3px 0;}
  .cart-group-row span:last-child{font-weight:800; color:var(--accent); flex-shrink:0; font-variant-numeric:tabular-nums;}

  button{font-family:var(--font-body);}
  button.primary{width:100%; padding:14px; margin-top:18px; background:linear-gradient(155deg, var(--accent-3), var(--accent)); color:var(--on-accent); border:none; border-radius:12px; font-size:15.5px; font-weight:700; letter-spacing:.2px; box-shadow:0 4px 14px color-mix(in srgb, var(--accent) 35%, transparent); transition:transform .12s ease, box-shadow .12s ease;}
  button.primary:active{transform:translateY(1px); box-shadow:0 2px 8px color-mix(in srgb, var(--accent) 35%, transparent);}
  button.primary:disabled{opacity:.5; box-shadow:none;}
  button.secondary{background:var(--bg); color:var(--text); border:1.5px solid var(--border); border-radius:11px; padding:13px; font-size:14.5px; font-weight:700;}
  button.danger{display:block; width:100%; background:none; border:1.5px solid var(--danger); color:var(--danger); border-radius:11px; padding:12px; font-size:13.5px; font-weight:700; margin-top:10px;}

  .msg{margin-top:11px; font-size:13px; text-align:center; font-weight:600;}
  .msg.ok{color:var(--today-text);}
  .msg.err{color:var(--danger);}

  .empty{color:var(--muted); text-align:center; padding:26px 10px; font-size:13.5px; font-weight:500;}

  .kpis{display:flex; gap:8px; margin-bottom:14px; flex-wrap:wrap;}
  .kpi{flex:1; min-width:78px; background:var(--card); border:1px solid var(--border); border-radius:14px; padding:13px 8px 11px; text-align:center; box-shadow:var(--shadow); position:relative; overflow:hidden;}
  .kpi::before{content:""; position:absolute; top:0; left:0; right:0; height:3px; background:linear-gradient(90deg, var(--accent), var(--accent-2));}
  .kpi .lbl{font-size:10.5px; color:var(--muted); font-weight:700; margin-bottom:5px; text-transform:uppercase; letter-spacing:.4px;}
  .kpi .val{font-family:var(--font-display); font-size:15px; font-weight:700; color:var(--text); font-variant-numeric:tabular-nums;}

  table{width:100%; border-collapse:collapse; font-size:13px;}
  th{text-align:left; color:var(--muted); font-size:10px; font-weight:700; padding:7px 4px; border-bottom:1.5px solid var(--border); text-transform:uppercase; letter-spacing:.3px;}
  td{padding:10px 4px; border-bottom:1px solid var(--border); font-variant-numeric:tabular-nums;}
  td.num{text-align:right; font-weight:700;}
  tbody tr:last-child td{border-bottom:none;}

  .status{display:flex; align-items:center; justify-content:center; gap:6px; font-size:11.5px; color:var(--muted); text-align:center; margin-top:20px; font-weight:600;}
  .status .pulse{width:6px; height:6px; border-radius:50%; background:var(--today-text); flex-shrink:0;}

  .nav{display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:14px;}
  .nav button{background:var(--card); border:1px solid var(--border); border-radius:11px; width:42px; height:42px; font-size:18px; color:var(--accent); font-weight:700; flex-shrink:0; box-shadow:var(--shadow);}
  .nav button:active{transform:scale(.94);}
  .nav .datepick input{text-align:center; font-weight:700;}
  .day-label{font-family:var(--font-display); font-weight:600; font-size:13.5px; margin-bottom:4px; text-wrap:balance;}
  .today-btn{display:flex; align-items:center; justify-content:center; gap:5px; margin:0 auto 14px; background:var(--accent-light); border:1px solid transparent; color:var(--accent); border-radius:20px; padding:7px 18px 7px 14px; font-size:12px; font-weight:700;}
  .today-btn svg{flex-shrink:0;}

  .legend{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:13px; padding:11px 12px; background:var(--card); border:1px solid var(--border); border-radius:12px;}
  .legend span{display:flex; align-items:center; gap:4px; font-size:10px; color:var(--muted); font-weight:600;}
  .legend i{width:8px; height:8px; border-radius:2.5px; display:inline-block; flex-shrink:0;}

  .grid-scroll{overflow-x:auto; border:1px solid var(--border); border-radius:14px; background:var(--card); -webkit-overflow-scrolling:touch; box-shadow:var(--shadow);}
  .grid-inner{position:relative; display:flex; width:100%;}
  .time-col{width:40px; flex-shrink:0; position:relative;}
  .time-col .tick{position:absolute; left:0; right:0; font-size:9.5px; color:var(--muted); transform:translateY(-6px); padding-right:5px; text-align:right; font-weight:600;}
  .emp-col{flex:1 1 88px; min-width:88px; position:relative; border-left:1px solid var(--border);}
  .emp-head{position:sticky; top:0; background:var(--card); border-bottom:1.5px solid var(--border); padding:9px 3px; text-align:center; font-size:10.5px; font-weight:700; z-index:2;}
  .emp-body{position:relative;}
  .hline{position:absolute; left:0; right:0; border-top:1px solid var(--border); opacity:.6;}
  .now-line{position:absolute; left:0; right:0; height:2px; background:var(--danger); z-index:4; border-radius:2px;}
  .now-line::before{content:""; position:absolute; left:-4px; top:-3px; width:8px; height:8px; border-radius:50%; background:var(--danger); box-shadow:0 0 0 3px color-mix(in srgb, var(--danger) 25%, transparent);}
  .now-tick{position:absolute; left:0; right:2px; font-size:9px; font-weight:800; color:var(--danger); background:var(--card); text-align:right; transform:translateY(-50%); z-index:4; padding-left:2px;}
  .overlap-badge{position:absolute; z-index:5; left:2px; right:2px; background:var(--accent); color:var(--on-accent); font-size:9px; font-weight:800; padding:2px 1px; border-radius:8px; text-align:center; box-shadow:0 1px 4px rgba(0,0,0,.4);}
  .appt{position:absolute; border-radius:7px; padding:4px 6px; font-size:10px; color:#fff; overflow:hidden; line-height:1.32; cursor:pointer; box-shadow:0 2px 5px rgba(0,0,0,.22); border:1px solid rgba(255,255,255,.18);}
  .appt b{display:block; font-size:10.5px; margin-bottom:1px;}
  .appt-group-badge{display:inline-block; background:rgba(255,255,255,.92); color:#171009; font-size:8.5px; font-weight:800; padding:0 4px; border-radius:6px; margin-left:4px; vertical-align:middle;}
  .appt .cli{opacity:.92; display:flex; justify-content:space-between; align-items:baseline; gap:4px;}
  .appt .cli > span:first-child{overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-width:0;}
  .appt .price{font-weight:800; white-space:nowrap; flex-shrink:0;}

  .modal-backdrop{position:fixed; inset:0; background:rgba(8,6,4,.68); z-index:100; display:flex; align-items:flex-end; justify-content:center; overscroll-behavior:contain;}
  .modal-card{background:var(--card); width:100%; max-width:640px; max-height:88vh; overflow-y:auto; -webkit-overflow-scrolling:touch; overscroll-behavior:contain; border-radius:20px 20px 0 0; padding:20px 16px 22px; box-shadow:0 -8px 30px rgba(0,0,0,.25);}
  @media (min-width:700px){ .modal-backdrop{align-items:center;} .modal-card{border-radius:20px;} }
  .modal-title{font-family:var(--font-display); font-weight:600; font-size:16px; margin-bottom:6px;}
  .modal-actions{display:flex; gap:8px; margin-top:18px;}
  .modal-actions button{flex:1; margin-top:0;}
  .userbar{display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; padding:0 2px;}
  .userbar .who{font-size:11.5px; color:var(--muted); font-weight:700;}
  .userbar .who b{color:var(--text);}
  .userbar .logout{font-size:11.5px; color:var(--accent); font-weight:700; cursor:pointer;}
  #loadingScreen{text-align:center; padding:80px 20px; color:var(--muted); font-size:13px; font-weight:600;}
</style>
</head>
<body>

<div id="loadingScreen">Chargement…</div>

<div class="wrap" id="loginWrap" style="max-width:380px; display:none;">
  <div class="brand">
    <svg width="35" height="38" viewBox="0 0 35 38" aria-hidden="true" fill="none" stroke="#c8a96e" stroke-width="1.6">
      <path d="M5 37V16.5a12.5 12.5 0 0 1 25 0V37"/>
      <path d="M2.5 37h30" stroke-linecap="round"/>
      <circle cx="17.5" cy="17" r="2.2" fill="#c8a96e" stroke="none"/>
    </svg>
    <h1>BOA Marrakech</h1>
  </div>
  <div class="sub">Planning &amp; chiffre d'affaires</div>
  <div class="card" style="margin-top:20px;">
    <div class="card-title"><span class="dot"></span>Connexion</div>
    <label>E-mail</label>
    <input type="email" id="loginEmail" autocomplete="username" autocapitalize="off">
    <label>Mot de passe</label>
    <input type="password" id="loginPassword" autocomplete="current-password">
    <button class="primary" id="btnLogin" onclick="doLogin()">Se connecter</button>
    <div class="msg" id="loginMsg"></div>
  </div>
</div>

<div class="wrap" id="appWrap" style="display:none;">
  <div class="brand">
    <svg width="35" height="38" viewBox="0 0 35 38" aria-hidden="true" fill="none" stroke="#c8a96e" stroke-width="1.6">
      <path d="M5 37V16.5a12.5 12.5 0 0 1 25 0V37"/>
      <path d="M2.5 37h30" stroke-linecap="round"/>
      <circle cx="17.5" cy="17" r="2.2" fill="#c8a96e" stroke="none"/>
    </svg>
    <h1>BOA Marrakech</h1>
  </div>
  <div class="sub">Planning &amp; chiffre d'affaires</div>
  <div class="userbar">
    <div class="who">Connecté : <b id="userBarName"></b></div>
    <div class="logout" onclick="doLogout()">Se déconnecter</div>
  </div>

  <div class="tabs">
    <div class="tab active" id="tabNew" onclick="showTab('new')">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>
      Rendez-vous
    </div>
    <div class="tab" id="tabPlanning" onclick="showTab('planning')">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M8 3v4M16 3v4M3.5 10h17"/></svg>
      Planning
    </div>
    <div class="tab" id="tabCa" onclick="showTab('ca')">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V13M12 20V6M20 20v-9"/></svg>
      CA
    </div>
    <div class="tab" id="tabPointage" onclick="showTab('pointage')">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg>
      Pointage
    </div>
  </div>

  <div id="viewNew"></div>
  <div id="viewPlanning" style="display:none"></div>
  <div id="viewCa" style="display:none"></div>
  <div id="viewPointage" style="display:none"></div>

  <div id="modalRoot" style="display:none"></div>

  <div class="status" id="status"><span class="pulse"></span>Chargement…</div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  function todayStr(){
    const d = new Date();
    return fmtIso(d);
  }
  function fmtIso(d){
    return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
  }
  function parseIso(s){
    const [y,m,d] = s.split("-").map(Number);
    return new Date(y, m-1, d);
  }
  function addDays(iso, n){
    const d = parseIso(iso);
    d.setDate(d.getDate()+n);
    return fmtIso(d);
  }
  function monthPrefix(iso){ return iso.slice(0,7); }
  function weekRange(iso){
    const d = parseIso(iso);
    const day = d.getDay();
    const diffToMonday = (day === 0) ? -6 : 1 - day;
    const monday = new Date(d); monday.setDate(d.getDate()+diffToMonday);
    const sunday = new Date(monday); sunday.setDate(monday.getDate()+6);
    return {start: fmtIso(monday), end: fmtIso(sunday)};
  }
  function fmtMoney(n){ return (Math.round(n*100)/100).toLocaleString("fr-FR")+" MAD"; }
  function minsFromStart(t){
    const parts = (t||"09:00").split(":");
    const h = Number(parts[0])||0, m = Number(parts[1])||0;
    return (h-START_H)*60 + m;
  }
  function isWithinOpeningHours(heure, heureFin){
    const opens = String(START_H).padStart(2,"0")+":00";
    const closes = String(END_H).padStart(2,"0")+":00";
    return heure >= opens && heureFin <= closes;
  }
  function addMin(t, dur){
    const parts = (t||"09:00").split(":");
    const h = Number(parts[0])||0, m = Number(parts[1])||0;
    const d = new Date(2000,0,1,h,m+dur);
    return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");
  }
  function fmtLong(iso){
    const d = parseIso(iso);
    return JOURS[d.getDay()]+" "+d.getDate()+" "+MOIS[d.getMonth()]+" "+d.getFullYear();
  }
  function escapeHtml(s){
    return String(s||"").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  }
  // Le PDF (police Helvetica standard) ne sait pas dessiner l'espace fine insécable
  // que toLocaleString("fr-FR") utilise entre les milliers — ça décale tout le texte.
  // On la remplace par un espace normal uniquement pour l'export PDF.
  function pdfSafe(v){
    return String(v==null ? "" : v).replace(/[  ]/g, " ");
  }
  function periodRows(from, to){
    return allDocs.filter(d => d.date && d.date >= from && d.date <= to).sort((a,b)=>{
      if((a.date||"")!==(b.date||"")) return (a.date||"") < (b.date||"") ? -1 : 1;
      return (a.heure||"").localeCompare(b.heure||"");
    });
  }

  function updatePeriodPreview(){
    const from = (document.getElementById('periodFrom')||{}).value;
    const to = (document.getElementById('periodTo')||{}).value;
    const lblEl = document.getElementById('periodLabel');
    const valEl = document.getElementById('periodVal');
    if(!lblEl || !valEl) return;
    if(!from || !to || to < from){
      lblEl.textContent = "Choisis une période valide (Au ≥ Du).";
      valEl.textContent = "—";
      return;
    }
    const rows = periodRows(from, to);
    const total = rows.reduce((s,d)=>s+(d.montant||0), 0);
    const label = from===to ? fmtLong(from) : `${fmtLong(from)} → ${fmtLong(to)}`;
    lblEl.textContent = `${label} · ${rows.length} rendez-vous`;
    valEl.textContent = fmtMoney(total);
  }

  async function exportCa(){
    const from = (document.getElementById('periodFrom')||{}).value;
    const to = (document.getElementById('periodTo')||{}).value;
    if(!from || !to){
      alert("Choisis une date de début et une date de fin.");
      return;
    }
    if(to < from){
      alert("La date de fin doit être après (ou égale à) la date de début.");
      return;
    }
    const rows = periodRows(from, to);
    if(rows.length===0){
      alert("Aucun rendez-vous sur cette période.");
      return;
    }
    if(!window.jspdf){
      alert("Le générateur PDF n'a pas pu se charger. Vérifie ta connexion et réessaie.");
      return;
    }
    const periodLabel = from===to ? fmtLong(from) : `${fmtLong(from)} au ${fmtLong(to)}`;
    const total = rows.reduce((s,d)=>s+(d.montant||0), 0);
    const fileTag = from===to ? from : `${from}_au_${to}`;

    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({unit:"pt"});
    doc.setFont("helvetica","bold"); doc.setFontSize(16);
    doc.text(pdfSafe("BOA Marrakech — Chiffre d'affaires"), 40, 44);
    doc.setFont("helvetica","normal"); doc.setFontSize(11);
    doc.text(pdfSafe(`Période : ${periodLabel}`), 40, 64);
    doc.text(pdfSafe(`Total : ${fmtMoney(total)}  —  ${rows.length} rendez-vous`), 40, 80);
    doc.autoTable({
      startY: 96,
      head: [["Date","Début","Fin","Employée","Prestation","Cliente","Montant"]],
      body: rows.map(d=>[d.date||"", d.heure||"", d.heureFin||"", d.employee||"", d.prestationDetail||d.prestation||"", d.cliente||"", pdfSafe(fmtMoney(d.montant||0))]),
      styles:{fontSize:8, cellPadding:4},
      headStyles:{fillColor:[200,169,110], textColor:[23,16,9]},
      margin:{left:40, right:40}
    });
    doc.save(`CA_BOA_Marrakech_${fileTag}.pdf`);
  }

  function renderCatalogueList(which, cat){
    const container = document.getElementById(which+'CatList');
    if(!container) return;

      `;
      return;
    }
    const items = CATALOGUE[cat];
    if(!cat || !items || items.length===0){
      container.innerHTML = "";
      return;
    }
    const cart = which==='f' ? fCart : eCart;
    const bases = SUPP_REQUIRES[cat];
    const suppReady = bases ? cartHasQualifyingBase(which, cat) : true;
    const hint = which==='f'
      ? `Tarifs ${escapeHtml(cat)} — touche un tarif pour l'ajouter au panier (touche plusieurs fois si plusieurs personnes prennent la même prestation)`
      : `Tarifs ${escapeHtml(cat)} — touche un ou plusieurs tarifs`;
    container.innerHTML = `
      <div class="cat-hint">${hint}</div>
      <div class="cat-list">
        ${items.map((it,idx)=>{
          const count = cart.filter(c=>c.cat===cat && c.idx===idx).length;
          const isLockedSupp = it.label===SUPP_LABEL && bases && count===0 && !suppReady;
          return `<div class="cat-item ${count>0?'selected':''} ${isLockedSupp?'disabled':''}" onclick="toggleCatalogueItem('${which}',${idx})">
            <span class="cat-check"></span>
            <span class="cat-label">${escapeHtml(it.label)}</span>
            ${count>1?`<span class="cat-count">×${count}</span>`:''}
            <span class="price">${it.price} MAD</span>
          </div>`;
        }).join("")}
      </div>
      ${bases ? `<div class="cat-hint" style="margin-top:8px; margin-bottom:0;">Le supplément vernis ne s'ajoute qu'à : ${bases.map(escapeHtml).join(" ou ")}.</div>` : ""}
    `;
  }

  function cartHasQualifyingBase(which, cat){
    const cart = which==='f' ? fCart : eCart;
    const bases = SUPP_REQUIRES[cat] || [];
    return cart.some(c=>c.cat===cat && bases.includes(c.label));
  }

  function itemFinalPrice(item){
    const val = item.reducValue || 0;
    let final = item.reducType==='%' ? item.price - (item.price*val/100) : item.price - val;
    if(final < 0) final = 0;
    return Math.round(final*100)/100;
  }

  function renderCart(which){
    const el = document.getElementById(which+'Cart');
    if(!el) return;
    const cart = which==='f' ? fCart : eCart;
    if(!cart.length){ el.innerHTML = ""; return; }

    if(which==='e'){
      // Fenêtre de modification : un seul rendez-vous (une employée, un horaire) —
      // le panier y reste une simple liste, comme avant.
      el.innerHTML = `<div class="cart">${cart.map((c,i)=>
        `<div class="cart-chip">${escapeHtml(c.label)} · ${c.price} MAD<span class="x" onclick="removeCartItem('${which}',${i})">×</span></div>`
      ).join("")}</div>`;
      return;
    }

    // Nouveau rendez-vous : dès qu'une prestation est cochée, on choisit directement
    // pour elle l'employée qui s'en occupe et son horaire (utile quand une cliente
    // voit plusieurs employées différentes l'une après l'autre dans le même RDV).
    const empOptions = (sel) => EMPLOYEES.map(v=>`<option value="${escapeHtml(v)}" ${v===sel?"selected":""}>${escapeHtml(v)}</option>`).join("");
    let total = 0;
    const rows = cart.map((item,i)=>{
      const finalPrice = itemFinalPrice(item);
      total += finalPrice;
      return `
        <div class="cart-item">
          <div class="cart-item-head">
            <span class="cart-item-label">${escapeHtml(item.label)}</span>
            <span class="cart-item-price" id="fCartPrice${i}">${finalPrice} MAD</span>
            <span class="x" onclick="removeCartItem('f',${i})">×</span>
          </div>
          <label class="mini-label">Employée</label>
          <select onchange="updateCartItem(${i},'employee',this.value)">
            <option value="">Choisir…</option>
            ${empOptions(item.employee)}
          </select>
          <label class="mini-label">Horaire</label>
          <div class="row2">
            <div class="field-clip"><input type="time" value="${escapeHtml(item.heureDebut||"")}" onchange="updateCartItem(${i},'heureDebut',this.value)"></div>
            <div class="field-clip"><input type="time" value="${escapeHtml(item.heureFin||"")}" onchange="updateCartItem(${i},'heureFin',this.value)"></div>
          </div>
          <label class="mini-label">Réduction <span style="text-transform:none; font-weight:600; opacity:.7;">(facultatif)</span></label>
          <div class="reduc-row mini">
            <div class="seg" data-type="${item.reducType}">
              <button type="button" class="seg-btn ${item.reducType==='MAD'?'active':''}" onclick="setCartReducType(${i},'MAD')">MAD</button>
              <button type="button" class="seg-btn ${item.reducType==='%'?'active':''}" onclick="setCartReducType(${i},'%')">%</button>
            </div>
            <input type="number" inputmode="decimal" placeholder="0" value="${item.reducValue||""}" oninput="updateCartItem(${i},'reducValue',this.value)">
          </div>
        </div>
      `;
    }).join("");

    // Le panier peut au final donner PLUSIEURS rendez-vous distincts (employées/horaires
    // différents) : on affiche toujours la répartition qui sera réellement enregistrée,
    // pour que le total vu ici corresponde exactement à ce qui sera sauvegardé.
    const groups = groupCartPreview(cart);
    let groupsHtml;
    if(groups.length <= 1){
      groupsHtml = `<div class="cart-total" id="fCartTotalWrap">Total : <span id="fCartTotalVal">${Math.round(total*100)/100}</span> MAD</div>`;
    } else {
      const groupRows = groups.map((g,gi)=>{
        const sub = Math.round(g.items.reduce((s,it)=>s+itemFinalPrice(it),0)*100)/100;
        const who = g.employee ? escapeHtml(g.employee) : "employée non choisie";
        const when = (g.heureDebut && g.heureFin) ? `${escapeHtml(g.heureDebut)}–${escapeHtml(g.heureFin)}` : "horaire non choisi";
        return `<div class="cart-group-row"><span>RDV ${gi+1} · ${who}, ${when} (${g.items.length} prestation${g.items.length>1?'s':''})</span><span id="fGroupSub${gi}">${sub} MAD</span></div>`;
      }).join("");
      groupsHtml = `
        <div class="cart-groups">
          <div class="cart-groups-hint">⚠️ Sera enregistré en ${groups.length} rendez-vous séparés (employées/horaires différents) :</div>
          ${groupRows}
        </div>
        <div class="cart-total" id="fCartTotalWrap">Total combiné : <span id="fCartTotalVal">${Math.round(total*100)/100}</span> MAD</div>
      `;
    }
    el.innerHTML = `<div class="cart-detailed">${rows}</div>${groupsHtml}`;
  }

  // Reproduit le regroupement fait à l'enregistrement (saveRdv) : les prestations
  // partageant la même employée + le même horaire finiront dans UN SEUL rendez-vous ;
  // les autres deviendront des rendez-vous séparés. Sert uniquement à l'aperçu.
  function groupCartPreview(cart){
    const groups = new Map();
    const order = [];
    for(const item of cart){
      const key = (item.employee||"")+"|"+(item.heureDebut||"")+"|"+(item.heureFin||"");
      if(!groups.has(key)){
        groups.set(key, {employee:item.employee||"", heureDebut:item.heureDebut||"", heureFin:item.heureFin||"", items:[]});
        order.push(key);
      }
      groups.get(key).items.push(item);
    }
    return order.map(k=>groups.get(k));
  }

  function updateCartItem(i, field, value){
    const item = fCart[i];
    if(!item) return;
    if(field === 'reducValue') item.reducValue = parseFloat(value) || 0;
    else item[field] = value;

    if(field === 'employee' || field === 'heureDebut' || field === 'heureFin'){
      // Le regroupement par rendez-vous peut changer : on refait tout l'affichage.
      renderCart('f');
      return;
    }

    if(field === 'reducValue'){
      // Le regroupement ne change pas ici : on met juste à jour les montants affichés,
      // sans reconstruire tout le panier (pour ne pas perdre le focus du champ pendant la saisie).
      const priceEl = document.getElementById('fCartPrice'+i);
      if(priceEl) priceEl.textContent = itemFinalPrice(item) + ' MAD';
      updateCartTotals();
    }
  }

  function updateCartTotals(){
    const groups = groupCartPreview(fCart);
    const total = Math.round(fCart.reduce((s,c)=>s+itemFinalPrice(c), 0) * 100) / 100;
    groups.forEach((g,gi)=>{
      const el = document.getElementById('fGroupSub'+gi);
      if(el) el.textContent = Math.round(g.items.reduce((s,it)=>s+itemFinalPrice(it),0)*100)/100 + ' MAD';
    });
    const totalEl = document.getElementById('fCartTotalVal');
    if(totalEl) totalEl.textContent = total;
  }

  function setCartReducType(i, type){
    const item = fCart[i];
    if(!item) return;
    item.reducType = type;
    renderCart('f');
  }

  // La catégorie ne sert qu'à parcourir le catalogue à afficher — elle ne remet
  // jamais à zéro le panier ni la réduction déjà en cours (on peut naviguer entre
  // catégories pour ajouter plusieurs prestations à un même rendez-vous).
  function onCategoryChange(which){
    const cat = document.getElementById(which+'Prestation').value;
    renderCatalogueList(which, cat);
  }

  function toggleCatalogueItem(which, idx){
    const cat = document.getElementById(which+'Prestation').value;
    const item = (CATALOGUE[cat]||[])[idx];
    if(!item) return;
    const cart = which==='f' ? fCart : eCart;
    const bases = SUPP_REQUIRES[cat];

    if(item.label===SUPP_LABEL && bases && !cartHasQualifyingBase(which, cat)){
      alert(`Le supplément vernis semi-permanent ne peut s'ajouter qu'avec : ${bases.join(" ou ")}.`);
      return;
    }

    if(which === 'f'){
      // Nouveau RDV : chaque touche ajoute une prestation supplémentaire au panier
      // (utile quand plusieurs personnes prennent la même prestation ce jour-là) —
      // pour en retirer une, on utilise la croix sur sa fiche dans le panier.
      cart.push({cat, idx, label:item.label, price:item.price, employee:"", heureDebut:"", heureFin:"", reducType:"MAD", reducValue:0});
    } else {
      // Fenêtre de modification : un seul rendez-vous, donc on garde la sélection
      // simple (toucher à nouveau retire la prestation).
      const pos = cart.findIndex(c=>c.cat===cat && c.idx===idx);
      if(pos===-1) cart.push({cat, idx, label:item.label, price:item.price});
      else cart.splice(pos,1);
      // Si on vient de retirer une prestation de base, le supplément vernis associé
      // n'a plus lieu d'être : on l'enlève aussi.
      if(pos!==-1 && bases && bases.includes(item.label) && !cartHasQualifyingBase(which, cat)){
        for(let i=cart.length-1; i>=0; i--){
          if(cart[i].cat===cat && cart[i].label===SUPP_LABEL) cart.splice(i,1);
        }
      }
    }

    recomputeFromCart(which);
    renderCatalogueList(which, cat);
    renderCart(which);
  }

  // Prestation sur mesure, absente du catalogue : on lui donne cat:null (elle n'est
  // rattachée à aucune catégorie du catalogue) et elle rejoint le panier comme les autres.
  function addCustomItem(which){
    const labelEl = document.getElementById(which+'CustomLabel');
    const priceEl = document.getElementById(which+'CustomPrice');
    const label = labelEl.value.trim();
    const price = parseFloat(priceEl.value);
    if(!label || isNaN(price)){
      alert("Indique un nom et un prix pour la prestation sur mesure.");
      return;
    }
    const cart = which==='f' ? fCart : eCart;
    cart.push({cat:null, idx:null, label, price, employee:"", heureDebut:"", heureFin:"", reducType:"MAD", reducValue:0});
    labelEl.value = "";
    priceEl.value = "";
    recomputeFromCart(which);
    renderCart(which);
  }

  function removeCartItem(which, cartIndex){
    const cart = which==='f' ? fCart : eCart;
    const removed = cart[cartIndex];
    cart.splice(cartIndex, 1);
    // Si on vient de retirer une prestation qui donnait droit au supplément vernis
    // et qu'il n'en reste plus aucune de ce type, le supplément n'a plus lieu
    // d'être : on l'enlève aussi.
    if(removed){
      const bases = SUPP_REQUIRES[removed.cat];
      if(bases && bases.includes(removed.label) && !cartHasQualifyingBase(which, removed.cat)){
        for(let i=cart.length-1; i>=0; i--){
          if(cart[i].cat===removed.cat && cart[i].label===SUPP_LABEL) cart.splice(i,1);
        }
      }
    }
    recomputeFromCart(which);
    renderCatalogueList(which, document.getElementById(which+'Prestation').value);
    renderCart(which);
  }

  // Dans le nouveau formulaire de RDV ("f"), chaque prestation du panier gère son
  // propre prix/employée/horaire (voir renderCart) — rien à recalculer ici, le
  // rendu se charge de tout. Dans la fenêtre de modification ("e"), un seul
  // rendez-vous est concerné : la logique globale base+réduction reste utilisée.
  function recomputeFromCart(which){
    if(which === 'f') return;
    const cart = eCart;
    document.getElementById('ePrestationDetail').value = cart.map(c=>c.label).join(" + ");
    if(cart.length){
      const sum = cart.reduce((s,c)=>s+c.price, 0);
      eBasePrice = sum;
      applyReduction('e');
    } else {
      eBasePrice = null;
    }
  }

  function setReducType(which, type){
    const seg = document.getElementById(which+'ReducSeg');
    if(!seg) return;
    seg.dataset.type = type;
    seg.querySelectorAll('.seg-btn').forEach(b=>b.classList.toggle('active', b.dataset.type===type));
    applyReduction(which);
  }

  function resetReduc(which){
    const seg = document.getElementById(which+'ReducSeg');
    if(seg){
      seg.dataset.type = 'MAD';
      seg.querySelectorAll('.seg-btn').forEach(b=>b.classList.toggle('active', b.dataset.type==='MAD'));
    }
    const rv = document.getElementById(which+'ReducValue');
    if(rv) rv.value = '';
  }

  function applyReduction(which){
    const base = which==='f' ? fBasePrice : eBasePrice;
    if(base==null) return;
    const seg = document.getElementById(which+'ReducSeg');
    const type = seg ? (seg.dataset.type||'MAD') : 'MAD';
    const val = parseFloat(document.getElementById(which+'ReducValue').value) || 0;
    let final = type==='%' ? base - (base*val/100) : base - val;
    if(final < 0) final = 0;
    document.getElementById(which+'Montant').value = Math.round(final*100)/100;
  }

  // Quand le montant est tapé à la main (sans réduction active), il devient
  // lui-même la nouvelle base — ainsi une réduction peut s'appliquer même
  // sur un prix hors catalogue (catégorie "Sur mesure", tarif spécial, etc.).
  function onMontantInput(which){
    const rv = parseFloat(document.getElementById(which+'ReducValue').value) || 0;
    if(rv === 0){
      const v = parseFloat(document.getElementById(which+'Montant').value);
      if(which==='f') fBasePrice = isNaN(v) ? null : v;
      else eBasePrice = isNaN(v) ? null : v;
    }
  }

  function renderNewForm(){
    const opts = arr => arr.map(v=>`<option value="${escapeHtml(v)}">${escapeHtml(v)}</option>`).join("");
    document.getElementById('viewNew').innerHTML = `

        <div class="field-clip"><input type="date" id="fDate" value="${todayStr()}"></div>
        <label>Catégorie</label>

  async function saveRdv(){
    const date = document.getElementById('fDate').value;
    const cliente = document.getElementById('fCliente').value.trim();
    const prestationSelect = document.getElementById('fPrestation').value;
    const msg = document.getElementById('formMsg');

    if(!date){
      msg.textContent = "Choisis une date.";
      msg.className = "msg err";
      return;
    }
    if(fCart.length === 0){
      msg.textContent = "Ajoute au moins une prestation (touche un tarif du catalogue, ou utilise \"Sur mesure\").";
      msg.className = "msg err";
      return;
    }
    if(!db){
      msg.textContent = "Connexion indisponible, réessaie dans un instant.";
      msg.className = "msg err";
      return;
    }

    // Chaque prestation a sa propre employée et son propre horaire. Les prestations
    // qui partagent la même employée + le même horaire sont regroupées dans un seul
    // rendez-vous ; les autres deviennent des rendez-vous séparés (ex : deux
    // employées différentes vues l'une après l'autre par la même cliente).
    const groups = new Map();
    for(const item of fCart){
      const emp = item.employee;
      const hd = item.heureDebut;
      const hf = item.heureFin;
      if(!emp || !hd || !hf){
        msg.textContent = `Choisis une employée et un horaire pour "${item.label}".`;
        msg.className = "msg err";
        return;
      }
      if(hf <= hd){
        msg.textContent = `L'heure de fin doit être après l'heure de début pour "${item.label}".`;
        msg.className = "msg err";
        return;
      }
      if(!isWithinOpeningHours(hd, hf)){
        msg.textContent = `L'horaire de "${item.label}" doit être entre ${String(START_H).padStart(2,"0")}:00 et ${String(END_H).padStart(2,"0")}:00.`;
        msg.className = "msg err";
        return;
      }
      const key = emp+"|"+hd+"|"+hf;
      if(!groups.has(key)) groups.set(key, {employee:emp, heure:hd, heureFin:hf, items:[]});
      groups.get(key).items.push(item);
    }

    // Un identifiant commun à tous les rendez-vous issus de cette même saisie — même
    // quand ils sont répartis en plusieurs créneaux (employées/horaires différents) —
    // pour pouvoir plus tard retrouver d'un coup tout ce qu'une cliente est venue faire.
    const visitId = Date.now().toString(36) + Math.random().toString(36).slice(2,8);

    const docsToSave = [];
    for(const g of groups.values()){
      const cats = [...new Set(g.items.map(it=>it.cat).filter(Boolean))];
      const prestation = cats.length ? (cats.length===1 ? cats[0] : cats.join(" + ")) : (prestationSelect || CUSTOM_CAT);
      const prestationDetail = g.items.map(it=>it.label).join(" + ");
      const montant = Math.round(g.items.reduce((s,it)=>s+itemFinalPrice(it), 0) * 100) / 100;
      docsToSave.push({
        date, heure:g.heure, heureFin:g.heureFin, cliente: cliente || "Client de passage",
        prestation, prestationDetail, employee:g.employee, montant, visitId,
        createdAt: new Date().toISOString()
      });
    }

    const btn = document.getElementById('btnSave');
    btn.disabled = true;
    try{
      for(const d of docsToSave){
        await db.collection("rendezvous").add(d);
      }
      msg.textContent = docsToSave.length > 1
        ? `${docsToSave.length} rendez-vous enregistrés ✓ (répartis par employée/horaire)`
        : "Rendez-vous enregistré ✓";
      msg.className = "msg ok";
      document.getElementById('fCliente').value = "";
      document.getElementById('fPrestation').value = "";
      fCart = [];
      renderCatalogueList('f', '');
      renderCart('f');
    }catch(e){
      msg.textContent = "Erreur : " + (e && e.message ? e.message : "réessaie.");
      msg.className = "msg err";
    }
    btn.disabled = false;
  }

  async function deleteRdv(id){
    if(!db) return;
    try{
      await db.collection("rendezvous").doc(id).delete();
    }catch(e){}

  function openEditRdv(id){
    const d = allDocs.find(x=>x.id===id);
    if(!d) return;
    const opts = (arr, sel) => arr.map(v=>`<option value="${escapeHtml(v)}" ${v===sel?"selected":""}>${escapeHtml(v)}</option>`).join("");
    // Si la catégorie enregistrée combine plusieurs catégories (ex: "Manucure + Pédicure"),
    // elle ne correspond à aucune option de la liste : on l'ajoute pour ne pas la perdre.
    const prestationOpts = PRESTATIONS.includes(d.prestation)
      ? opts(PRESTATIONS, d.prestation)
      : `<option value="${escapeHtml(d.prestation||"")}" selected>${escapeHtml(d.prestation||"—")}</option>` + opts(PRESTATIONS, "");

    // Autres créneaux issus de la même saisie (même visitId) : même cliente venue faire
    // plusieurs prestations avec des employées/horaires différents. On les retrouve tous
    // d'un coup ici, sans avoir à ouvrir chaque créneau un par un.
    const siblings = d.visitId ? allDocs.filter(x=>x.visitId===d.visitId && x.id!==d.id) : [];
    let groupHtml = "";
    if(siblings.length){
      const all = [d, ...siblings].sort((a,b)=>(a.heure||"").localeCompare(b.heure||""));
      const total = Math.round(all.reduce((s,x)=>s+(x.montant||0),0)*100)/100;
      const rowsHtml = all.map(x=>`
        <div class="cart-group-row" style="${x.id===d.id?'':'cursor:pointer;'}" ${x.id===d.id?'':`onclick="openEditRdv('${x.id}')"`}>
          <span>${x.id===d.id?'<b>▸</b> ':''}${escapeHtml(x.heure||"—")}–${escapeHtml(x.heureFin||"—")} · ${escapeHtml(x.employee||"—")} · ${escapeHtml(x.prestationDetail||x.prestation||"—")}</span>
          <span>${Math.round(x.montant||0)} MAD</span>
        </div>
      `).join("");
      groupHtml = `
        <div class="cart-groups" style="margin-top:0; margin-bottom:16px;">
          <div class="cart-groups-hint">Ce rendez-vous comprend ${all.length} prestations (employées/horaires différents) — touche une ligne pour l'ouvrir :</div>
          ${rowsHtml}
          <div class="cart-total" style="margin-top:8px;">Total de la visite : ${total} MAD</div>
        </div>
      `;
    }

    document.getElementById('modalRoot').innerHTML = `
      <div class="modal-backdrop" onclick="if(event.target===this) closeModal()">
        <div class="modal-card">
          <div class="modal-title">Modifier le rendez-vous</div>
          ${groupHtml}
          <label>Date</label>
          <div class="field-clip"><input type="date" id="eDate" value="${escapeHtml(d.date||"")}"></div>
          <div class="row2">
            <div>
              <label>Heure de début</label>
              <input type="time" id="eHeureDebut" value="${escapeHtml(d.heure||"")}" min="${String(START_H).padStart(2,"0")}:00" max="${String(END_H).padStart(2,"0")}:00">
            </div>
            <div>
              <label>Heure de fin</label>
              <input type="time" id="eHeureFin" value="${escapeHtml(d.heureFin||"")}" min="${String(START_H).padStart(2,"0")}:00" max="${String(END_H).padStart(2,"0")}:00">
            </div>
          </div>
          <label>Cliente</label>
          <input type="text" id="eCliente" value="${escapeHtml(d.cliente||"")}">
          <label>Catégorie</label>
          <select id="ePrestation" onchange="onCategoryChange('e')">${prestationOpts}</select>
          <div class="cat-list-wrap" id="eCatList"></div>
          <div id="eCart"></div>
          <label>Détail de la prestation</label>
          <input type="text" id="ePrestationDetail" value="${escapeHtml(d.prestationDetail||"")}">
          <label>Réduction <span style="text-transform:none; font-weight:600; opacity:.7;">(facultatif)</span></label>
          <div class="reduc-row">
            <div class="seg" id="eReducSeg" data-type="MAD">
              <button type="button" class="seg-btn active" data-type="MAD" onclick="setReducType('e','MAD')">MAD</button>
              <button type="button" class="seg-btn" data-type="%" onclick="setReducType('e','%')">%</button>
            </div>
            <input type="number" id="eReducValue" inputmode="decimal" placeholder="0" oninput="applyReduction('e')">
          </div>
          <label>Montant (MAD)</label>
          <input type="number" id="eMontant" inputmode="decimal" value="${d.montant||0}" oninput="onMontantInput('e')">
          <label>Employée</label>
          <select id="eEmployee">${opts(EMPLOYEES, d.employee)}</select>
          <div class="msg" id="editMsg"></div>
          <div class="modal-actions">
            <button class="secondary" onclick="closeModal()">Annuler</button>
            <button class="primary" onclick="saveEditRdv('${id}')">Enregistrer</button>
          </div>
          <button class="danger" onclick="deleteFromModal('${id}')">Supprimer ce rendez-vous</button>
        </div>
      </div>
    `;
    document.getElementById('modalRoot').style.display = 'block';
    // Si on saute d'un créneau à l'autre via la vue d'ensemble, la modale est déjà
    // ouverte et le body déjà figé : on ne relance pas le blocage de défilement, sinon
    // la position d'origine sauvegardée serait écrasée par 0 (body déjà en position:fixed).
    if(document.body.style.position !== 'fixed') lockBodyScroll();
    // Reconstruit le panier à partir du libellé enregistré, en cherchant chaque
    // partie dans toutes les catégories (pas seulement la catégorie stockée), pour
    // retrouver aussi les rendez-vous combinant plusieurs catégories.
    eCart = [];
    (d.prestationDetail||"").split(" + ").map(s=>s.trim()).filter(Boolean).forEach(label=>{
      for(const cat in CATALOGUE){
        const idx = CATALOGUE[cat].findIndex(it=>it.label===label);
        if(idx!==-1){ eCart.push({cat, idx, label, price:CATALOGUE[cat][idx].price}); break; }
      }
    });
    eBasePrice = eCart.length ? eCart.reduce((s,c)=>s+c.price,0) : (d.montant || null);
    renderCatalogueList('e', d.prestation);
    renderCart('e');
  }

  // Bloque le défilement de l'arrière-plan pendant qu'une fenêtre (modale) est ouverte —
  // sur mobile (surtout iOS Safari), sans ça, un doigt posé sur la modale peut faire
  // défiler la page en dessous au lieu du contenu de la fenêtre. On fige le body en
  // "position:fixed" à sa position actuelle, puis on la restaure à la fermeture.
  let modalScrollY = 0;
  function lockBodyScroll(){
    modalScrollY = window.scrollY || document.documentElement.scrollTop || 0;
    document.body.style.position = 'fixed';
    document.body.style.top = (-modalScrollY) + 'px';
    document.body.style.left = '0';
    document.body.style.right = '0';
    document.body.style.width = '100%';
  }
  function unlockBodyScroll(){
    document.body.style.position = '';
    document.body.style.top = '';
    document.body.style.left = '';
    document.body.style.right = '';
    document.body.style.width = '';
    window.scrollTo(0, modalScrollY);
  }

  function closeModal(){
    document.getElementById('modalRoot').style.display = 'none';
    document.getElementById('modalRoot').innerHTML = '';
    unlockBodyScroll();
  }

  async function saveEditRdv(id){
    const modifiePar = currentUserName;
    const date = document.getElementById('eDate').value;
    const heure = document.getElementById('eHeureDebut').value;
    const heureFin = document.getElementById('eHeureFin').value;
    const cliente = document.getElementById('eCliente').value.trim();
    const prestationSelect = document.getElementById('ePrestation').value;
    const prestationDetail = document.getElementById('ePrestationDetail').value.trim();
    const employee = document.getElementById('eEmployee').value;
    const montant = parseFloat(document.getElementById('eMontant').value);
    const msg = document.getElementById('editMsg');
    const cartCats = [...new Set(eCart.map(c=>c.cat).filter(Boolean))];
    const prestation = cartCats.length ? (cartCats.length===1 ? cartCats[0] : cartCats.join(" + ")) : prestationSelect;

    if(!date || !heure || !heureFin || !prestation || !employee || isNaN(montant)){
      msg.textContent = "Remplis tous les champs obligatoires.";
      msg.className = "msg err";
      return;
    }
    if(heureFin <= heure){
      msg.textContent = "L'heure de fin doit être après l'heure de début.";
      msg.className = "msg err";
      return;
    }
    if(!isWithinOpeningHours(heure, heureFin)){
      msg.textContent = `L'horaire doit être entre ${String(START_H).padStart(2,"0")}:00 et ${String(END_H).padStart(2,"0")}:00 (heures d'ouverture).`;
      msg.className = "msg err";
      return;
    }
    if(!db){
      msg.textContent = "Connexion indisponible, réessaie dans un instant.";
      msg.className = "msg err";
      return;
    }
    const before = allDocs.find(x=>x.id===id);
    const afterData = {
      date, heure, heureFin, cliente: cliente || "Client de passage",
      prestation, prestationDetail: prestationDetail || prestation,
      employee, montant
    };
    try{
      await db.collection("rendezvous").doc(id).update(afterData);
      await logAudit('modification', id, before, afterData, modifiePar);
      closeModal();
    }catch(e){
      msg.textContent = "Erreur : " + (e && e.message ? e.message : "réessaie.");
      msg.className = "msg err";
    }
  }

  async function deleteFromModal(id){
    const modifiePar = currentUserName;
    if(confirm("Supprimer ce rendez-vous ?")){
      const before = allDocs.find(x=>x.id===id);
      await deleteRdv(id);
      await logAudit('suppression', id, before, null, modifiePar);

  async function logAudit(action, rdvId, before, after, modifiePar){
    if(!db || !before) return;
    const snap = d => ({
      date: d.date||"", heure: d.heure||"", heureFin: d.heureFin||"", employee: d.employee||"",
      prestation: d.prestation||"", prestationDetail: d.prestationDetail||"", cliente: d.cliente||"", montant: d.montant||0
    });
    try{
      await db.collection("audit_log").add({
        action, rdvId, modifiePar,
        before: snap(before),
        after: after ? snap(after) : null,
        at: new Date().toISOString()
      });
    }catch(e){}
  }

    renderPlanning();

  // ---- Pointage des employées (heure d'arrivée / heure de départ) ----
  // Un document par employée et par jour, identifié par "date__employée" pour
  // que ressaisir une heure mette simplement à jour la même fiche (pas de doublon).
  function pointageDocId(date, employee){
    return date + "__" + employee;
  }
  function findPointage(date, employee){
    return pointageDocs.find(p=>p.date===date && p.employee===employee) || null;
  }
  // Calcule la durée travaillée entre deux heures "HH:MM" (ex: "7h30"). Renvoie
  // null si l'une des deux heures manque encore.
  function pointageDuration(a, b){
    if(!a || !b) return null;
    const [ah,am] = a.split(":").map(Number);
    const [bh,bm] = b.split(":").map(Number);
    let mins = (bh*60+bm) - (ah*60+am);
    if(mins < 0) mins += 24*60;
    const h = Math.floor(mins/60), m = mins%60;
    return {mins, label: `${h}h${String(m).padStart(2,"0")}`};
  }

  // Écriture réelle du pointage — n'est appelée qu'après confirmation du mot de passe
  // du compte connecté (voir confirmPointageChange ci-dessous), pour qu'une personne
  // qui laisserait la page ouverte ne puisse pas trafiquer ses propres heures.
  async function savePointage(employee, field, value){
    if(!db) return;
    const id = pointageDocId(pointageDate, employee);
    try{
      await db.collection("pointages").doc(id).set({
        date: pointageDate, employee, [field]: value,
        updatedAt: new Date().toISOString(), modifiePar: currentUserName
      }, {merge:true});
    }catch(e){
      alert("Erreur d'enregistrement du pointage : " + (e && e.message ? e.message : "réessaie."));
    }
  }

  let pendingPointageChange = null;

  // Le sélecteur d'heure natif (surtout sur mobile) déclenche souvent plusieurs
  // événements "change" coup sur coup pendant qu'on fait défiler les heures/minutes —
  // pas un seul à la fin. Sans attendre, la demande de mot de passe s'ouvrait dès le
  // premier tic de défilement, en pleine saisie, avant même d'avoir choisi la bonne heure.
  // On attend donc un court instant sans nouveau changement avant d'agir, pour ne réagir
  // qu'une fois la vraie valeur choisie.
  function onPointageTimeChange(employee, field, inputEl){
    clearTimeout(inputEl._pointageDebounce);
    inputEl._pointageDebounce = setTimeout(()=>{
      confirmPointageChange(employee, field, inputEl.value, inputEl);
    }, 600);
  }

  // La toute première saisie d'une heure (le champ était vide) s'enregistre directement,
  // sans mot de passe — sinon la pointeuse deviendrait pénible à utiliser au quotidien.
  // Le mot de passe n'est redemandé que pour MODIFIER une heure déjà enregistrée, ce qui
  // est le seul cas où une fraude est possible (changer après coup une heure déjà pointée).
  function confirmPointageChange(employee, field, value, inputEl){
    const previousValue = inputEl.dataset.prev || "";
    if(value === previousValue) return; // rien n'a vraiment changé une fois l'interaction terminée
    if(!previousValue){
      inputEl.dataset.prev = value;
      savePointage(employee, field, value);
      return;
    }
    pendingPointageChange = {employee, field, value, previousValue, inputEl};
    const fieldLabel = field === 'heureArrivee' ? "d'arrivée" : "de départ";
    document.getElementById('modalRoot').innerHTML = `
      <div class="modal-backdrop" onclick="if(event.target===this) cancelPointageChange()">
        <div class="modal-card" style="max-width:380px;">
          <div class="modal-title">Confirmation requise</div>
          <div style="font-size:12.5px; color:var(--muted); font-weight:600; line-height:1.5; margin-bottom:14px;">
            Pour modifier l'heure ${fieldLabel} de <b style="color:var(--text)">${escapeHtml(employee)}</b>, entre le mot de passe du compte connecté (${escapeHtml(currentUserName)}).
          </div>
          <label>Mot de passe</label>
          <input type="password" id="ptConfirmPassword" autocomplete="current-password">
          <div class="msg" id="ptConfirmMsg"></div>
          <div class="modal-actions">
            <button class="secondary" onclick="cancelPointageChange()">Annuler</button>
            <button class="primary" id="ptConfirmBtn" onclick="submitPointageChange()">Confirmer</button>
          </div>
        </div>
      </div>
    `;
    document.getElementById('modalRoot').style.display = 'block';
    if(document.body.style.position !== 'fixed') lockBodyScroll();
    const pwField = document.getElementById('ptConfirmPassword');
    pwField.focus();
    pwField.addEventListener('keydown', (e)=>{ if(e.key === 'Enter') submitPointageChange(); });
  }

  function reauthErrorMsg(e){
    const code = e && e.code || "";
    if(code === "auth/wrong-password" || code === "auth/invalid-credential") return "Mot de passe incorrect.";
    if(code === "auth/too-many-requests") return "Trop de tentatives, réessaie dans quelques minutes.";
    if(code === "auth/network-request-failed") return "Pas de connexion internet.";
    return "Échec de la confirmation, réessaie.";
  }

  async function submitPointageChange(){
    if(!pendingPointageChange) return;
    const pwd = document.getElementById('ptConfirmPassword').value;
    const msg = document.getElementById('ptConfirmMsg');
    const btn = document.getElementById('ptConfirmBtn');
    if(!pwd){
      msg.textContent = "Entre le mot de passe.";
      msg.className = "msg err";
      return;
    }
    btn.disabled = true;
    try{
      const user = auth.currentUser;
      const cred = firebase.auth.EmailAuthProvider.credential(user.email, pwd);
      await user.reauthenticateWithCredential(cred);
      const change = pendingPointageChange;
      pendingPointageChange = null;
      closeModal();
      await savePointage(change.employee, change.field, change.value);
    }catch(e){
      msg.textContent = reauthErrorMsg(e);
      msg.className = "msg err";
      btn.disabled = false;
    }
  }

  function cancelPointageChange(){
    if(pendingPointageChange && pendingPointageChange.inputEl){
      pendingPointageChange.inputEl.value = pendingPointageChange.previousValue;
    }
    pendingPointageChange = null;
    closeModal();
  }

    pointageDate = addDays(pointageDate, n);
    renderPointage();
  }
  function jumpPointageToday(){
    pointageDate = todayStr();
    renderPointage();
  }
  function onPointageDateInput(v){
    if(v){ pointageDate = v; renderPointage(); }
  }

            <div>
              <label class="mini-label">Arrivée</label>

              <label class="mini-label">Départ</label>

          <div class="datepick">

          <button onclick="shiftPointage(1)">›</button>
        </div>
        ${isToday ? '' : '<button class="today-btn" onclick="jumpPointageToday()"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>Revenir à aujourd’hui</button>'}
        <div class="cart-detailed">${rows}</div>
      </div>
      <div class="card">
        <div class="card-title"><span class="dot" style="background:var(--accent-3)"></span>Récapitulatif sur une période</div>
        <div class="row2">
          <div><label>Du</label><input type="date" id="ptPeriodFrom" value="${minDate}" onchange="renderPointageRecap()"></div>
          <div><label>Au</label><input type="date" id="ptPeriodTo" value="${maxDate}" onchange="renderPointageRecap()"></div>

  function renderPointageRecap(){
    const fromEl = document.getElementById('ptPeriodFrom');
    const toEl = document.getElementById('ptPeriodTo');
    const totalsEl = document.getElementById('ptTotals');
    const histEl = document.getElementById('ptHistory');
    if(!fromEl || !toEl || !totalsEl || !histEl) return;
    const from = fromEl.value, to = toEl.value;
    if(!from || !to || to < from){
      totalsEl.innerHTML = '<div class="empty">Choisis une période valide (Au ≥ Du).</div>';
      histEl.innerHTML = "";
      return;
    }
    const rows = pointageDocs
      .filter(p=>p.date && p.date>=from && p.date<=to)
      .sort((a,b)=>{
        if(a.date !== b.date) return a.date < b.date ? 1 : -1;
        return (a.employee||"").localeCompare(b.employee||"");
      });

    const totalsByEmp = {};
    EMPLOYEES.forEach(e=>totalsByEmp[e] = 0);
    rows.forEach(p=>{
      const dur = pointageDuration(p.heureArrivee, p.heureDepart);
      if(dur && totalsByEmp[p.employee] !== undefined) totalsByEmp[p.employee] += dur.mins;
    });
    const totalsRows = EMPLOYEES.map(e=>{
      const mins = totalsByEmp[e];
      const label = mins>0 ? `${Math.floor(mins/60)}h${String(mins%60).padStart(2,"0")}` : "—";
      return `<tr><td>${escapeHtml(e)}</td><td class="num">${label}</td></tr>`;
    }).join("");
    totalsEl.innerHTML = `
      <div class="card-title" style="font-size:12px;"><span class="dot" style="background:var(--accent-2)"></span>Total d'heures par employée</div>

        <thead><tr><th>Employée</th><th style="text-align:right">Heures</th></tr></thead>

      </table>
      </div>
    `;

    if(rows.length===0){
      histEl.innerHTML = '<div class="empty">Aucun pointage sur cette période</div>';
      return;
    }
    const histRows = rows.map(p=>{
      const dur = pointageDuration(p.heureArrivee, p.heureDepart);
      return `<tr>
        <td>${escapeHtml(fmtLong(p.date))}</td>
        <td>${escapeHtml(p.employee||"—")}</td>

      </table>
      </div>

  function renderPlanning(){
    const dayItems = allDocs.filter(d=>d.date===planningDate);
    const isToday = planningDate === todayStr();
    const totalMin = (END_H-START_H)*60;
    const bodyHeight = totalMin*PX_PER_MIN;

    let ticks = "", hlines = "";
    for(let h=START_H; h<=END_H; h++){
      const top = (h-START_H)*60*PX_PER_MIN;
      ticks += `<div class="tick" style="top:${top}px">${h}h</div>`;
      hlines += `<div class="hline" style="top:${top}px"></div>`;
    }

    const now = new Date();
    const nowStr = String(now.getHours()).padStart(2,"0")+":"+String(now.getMinutes()).padStart(2,"0");
    const nowMin = minsFromStart(nowStr);
    const showNow = isToday && nowMin >= 0 && nowMin <= totalMin;
    if(showNow){
      const nowTop = nowMin*PX_PER_MIN;
      ticks += `<div class="now-tick" style="top:${nowTop}px">${nowStr}</div>`;
      hlines += `<div class="now-line" style="top:${nowTop}px"></div>`;
    }

    // Une seule piste globale : tous les rendez-vous, toutes employées confondues.
    // On ne crée des colonnes côte à côte que lorsque des rendez-vous se chevauchent réellement.
    const raw = dayItems.map(d=>{
      const startMin = Math.max(0, minsFromStart(d.heure));
      const realEndMin = d.heureFin ? minsFromStart(d.heureFin) : startMin + (DURATIONS[d.prestation] || 45);
      const visualEndMin = Math.max(startMin+MIN_BLOCK_MIN, realEndMin);
      return {d, startMin, realEndMin, visualEndMin};
    }).sort((a,b)=>a.startMin-b.startMin);

    const laneEnds = [];
    raw.forEach(it=>{
      let lane = laneEnds.findIndex(e => e <= it.startMin);
      if(lane === -1){ lane = laneEnds.length; laneEnds.push(it.visualEndMin); }
      else laneEnds[lane] = it.visualEndMin;
      it.lane = lane;
    });
    const laneCount = Math.max(1, laneEnds.length);
    const MIN_LANE_PX = 108; // largeur mini pour lire heure + employée + montant

    // Regroupe les rendez-vous qui se chevauchent en clusters, pour afficher
    // un badge "X en même temps" au-dessus de chaque groupe concerné.
    const clusters = [];
    raw.forEach(it=>{
      const cur = clusters[clusters.length-1];
      if(!cur || it.startMin >= cur.end){
        clusters.push({start: it.startMin, end: it.visualEndMin, items:[it]});
      } else {
        cur.items.push(it);
        cur.end = Math.max(cur.end, it.visualEndMin);
      }
    });
    const badges = clusters.filter(cl=>cl.items.length>1).map(cl=>{
      let maxConcurrent = 0;
      cl.items.forEach(it=>{
        const activeAt = cl.items.filter(o=> o.startMin <= it.startMin && o.visualEndMin > it.startMin).length;
        maxConcurrent = Math.max(maxConcurrent, activeAt);
      });
      if(maxConcurrent < 2) return "";
      const top = cl.start*PX_PER_MIN + 12;
      return `<div class="overlap-badge" style="top:${top}px" title="${maxConcurrent} rendez-vous en même temps">×${maxConcurrent}</div>`;
    }).join("");

    const items = raw.map(it=>{
      const d = it.d;
      const top = it.startMin*PX_PER_MIN;
      const h = (it.visualEndMin - it.startMin)*PX_PER_MIN;
      const end = d.heureFin || addMin(d.heure, it.realEndMin - it.startMin);
      const color = COLORS[d.prestation] || "#8a7d76";
      const label = d.prestationDetail || d.prestation || "—";
      const widthPct = 100/laneCount;
      const leftPct = it.lane*widthPct;
      // Rendez-vous répartis sur plusieurs créneaux (même visitId) : un petit badge
      // signale tout de suite que d'autres prestations de la même visite existent ailleurs.
      const siblingCount = d.visitId ? dayItems.filter(x=>x.visitId===d.visitId && x.id!==d.id).length : 0;
      const groupBadge = siblingCount ? `<span class="appt-group-badge" title="Fait partie d'un même rendez-vous, avec ${siblingCount} autre(s) créneau(x)">+${siblingCount}</span>` : '';
      return `<div class="appt" style="top:${top}px; height:${h}px; left:calc(${leftPct}% + 2px); width:calc(${widthPct}% - 4px); background:${color}" onclick="openEditRdv('${d.id}')">
        <b>${escapeHtml(d.heure||"—")}–${escapeHtml(end)} · ${escapeHtml(d.employee||"—")}${groupBadge}</b>
        <div class="cli"><span>${escapeHtml(label)}</span><span class="price">${Math.round(d.montant||0)}</span></div>
      </div>`;
    }).join("");

    const globalCol = `<div class="emp-col" style="flex:1 1 auto; min-width:0;">
      <div class="emp-head">${dayItems.length} rendez-vous</div>
      <div class="emp-body" style="height:${bodyHeight}px">${hlines}${items}</div>
    </div>`;
    const innerMinWidth = 40 + laneCount*MIN_LANE_PX;

    document.getElementById('viewPlanning').innerHTML = `
      <div class="nav">
        <button onclick="shiftPlanning(-1)">‹</button>
        <div class="datepick">
          <div class="day-label">${fmtLong(planningDate)}</div>
          <input type="date" value="${planningDate}" onchange="onPlanningDateInput(this.value)">
        </div>
        <button onclick="shiftPlanning(1)">›</button>
      </div>
      ${isToday ? '' : '<button class="today-btn" onclick="jumpToday()"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>Revenir à aujourd’hui</button>'}
      <div class="legend">${Object.keys(COLORS).map(k=>`<span><i style="background:${COLORS[k]}"></i>${escapeHtml(k)}</span>`).join("")}</div>
      <div class="grid-scroll">
        <div class="grid-inner" style="min-width:${innerMinWidth}px">
          <div class="time-col"><div class="emp-head">&nbsp;</div><div class="emp-body" style="height:${bodyHeight}px">${ticks}${badges}</div></div>
          ${globalCol}
        </div>
      </div>
      ${dayItems.length===0 ? '<div class="empty">Aucun rendez-vous ce jour</div>' : ''}
    `;
  }

      <div class="card">

  // Supprime une collection entière, par lots de 450 (limite Firestore : 500 opérations
  // par batch), après confirmation forte (taper un mot exact, pas juste "OK/Annuler",
  // vu que l'action est définitive et irréversible).
  async function deleteWholeCollection(name, confirmWord, warningText){
    if(!db) return;
    const typed = prompt(`${warningText}\n\nTape ${confirmWord} (en majuscules) pour confirmer.`);
    if(typed === null) return;
    if(typed.trim() !== confirmWord){
      alert("Annulé : le texte tapé ne correspond pas exactement à " + confirmWord + ".");
      return;
    }
    try{
      const snap = await db.collection(name).get();
      const docs = snap.docs;
      for(let i=0; i<docs.length; i+=450){
        const batch = db.batch();
        docs.slice(i, i+450).forEach(d=>batch.delete(d.ref));
        await batch.commit();
      }
      alert(`${docs.length} élément(s) supprimé(s).`);
    }catch(e){
      alert("Erreur lors de la suppression : " + (e && e.message ? e.message : "réessaie."));
    }
  }

  async function resetAllRdv(){
    await deleteWholeCollection(
      "rendezvous",
      "SUPPRIMER",
      `Ceci supprime DÉFINITIVEMENT les ${allDocs.length} rendez-vous enregistrés, avec tous leurs montants. Le CA et le planning repartiront de zéro.`
    );
  }

  async function resetAllPointages(){
    await deleteWholeCollection(
      "pointages",
      "SUPPRIMER",
      `Ceci supprime DÉFINITIVEMENT les ${pointageDocs.length} fiches de pointage enregistrées (arrivées/départs).`
    );
  }

  function auditDiffLines(before, after){
    if(!after) return [];
    const fields = [
      ["date","Date"], ["heure","Début"], ["heureFin","Fin"], ["employee","Employée"],
      ["prestation","Catégorie"], ["prestationDetail","Prestation"], ["cliente","Cliente"], ["montant","Montant"]
    ];
    const lines = [];
    fields.forEach(([key,label])=>{
      const b = before ? before[key] : undefined;
      const a = after[key];
      if(String(b==null?"":b) !== String(a==null?"":a)){
        const bv = key==="montant" ? fmtMoney(b||0) : (b || "—");
        const av = key==="montant" ? fmtMoney(a||0) : (a || "—");
        lines.push(`${label} : ${bv} → ${av}`);
      }
    });
    return lines;
  }

  function renderAuditLog(){
    if(auditDocs.length===0) return '<div class="empty">Aucune modification enregistrée pour le moment</div>';
    const rowsHtml = auditDocs.map(a=>{
      const b = a.before || {};
      const isPast = b.date && b.date < todayStr();
      const isDelete = a.action === 'suppression';
      const actionLabel = isDelete ? 'Supprimé' : 'Modifié';
      const actionColor = isDelete ? 'var(--danger)' : 'var(--accent)';
      let when = "";
      try{ when = new Date(a.at).toLocaleString('fr-FR', {day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit'}); }catch(e){ when = a.at || ""; }
      const diffs = !isDelete ? auditDiffLines(b, a.after||{}) : [];
      return `<div style="padding:11px 0; border-bottom:1px solid var(--border);">
        <div style="display:flex; justify-content:space-between; align-items:center; gap:8px; margin-bottom:5px;">
          <span style="font-weight:800; font-size:11.5px; color:${actionColor};">${actionLabel}</span>
          <span style="display:flex; align-items:center; gap:8px;">
            <span style="font-size:10.5px; color:var(--muted);">${escapeHtml(when)}</span>
            <span onclick="deleteAuditEntry('${a.id}')" style="cursor:pointer; width:18px; height:18px; border-radius:50%; background:var(--card-2); display:flex; align-items:center; justify-content:center; font-size:13px; color:var(--muted); flex-shrink:0;">×</span>
          </span>
        </div>
        <div style="font-size:12.5px; margin-bottom:3px;">Rdv du ${escapeHtml(fmtLong(b.date||""))} à ${escapeHtml(b.heure||"—")} · ${escapeHtml(b.employee||"—")} · ${fmtMoney(b.montant||0)}${isPast ? ' <span style="color:var(--danger); font-weight:800;">· RDV déjà passé</span>' : ''}</div>
        <div style="font-size:11.5px; color:var(--muted);">Par : ${escapeHtml(a.modifiePar||"—")}</div>
        ${diffs.length ? `<div style="font-size:11.5px; color:var(--muted); margin-top:4px;">${diffs.map(escapeHtml).join('<br>')}</div>` : ''}
      </div>`;
    }).join("");
    return `<div>${rowsHtml}</div>`;
  }

  async function deleteAuditEntry(id){
    if(!db || !id) return;
    if(!confirm("Supprimer cette entrée du journal ? C'est définitif.")) return;
    try{
      await db.collection("audit_log").doc(id).delete();
    }catch(e){
      alert("Erreur lors de la suppression : " + (e && e.message ? e.message : "réessaie."));
    }
  }

  // Vide tout le journal, y compris les entrées plus anciennes que les 200 dernières
  // affichées à l'écran (sinon le journal continuerait à grossir sans fin en arrière-plan).
  async function clearAuditLog(){
    if(!db) return;
    if(!confirm("Vider tout le journal des modifications ? C'est définitif et ne peut pas être annulé.")) return;
    try{
      const snap = await db.collection("audit_log").get();
      const docs = snap.docs;
      for(let i=0; i<docs.length; i+=450){
        const batch = db.batch();
        docs.slice(i, i+450).forEach(d=>batch.delete(d.ref));
        await batch.commit();
      }
    }catch(e){
      alert("Erreur lors du vidage du journal : " + (e && e.message ? e.message : "réessaie."));
    }
  }

  function authErrorMsg(e){
    const code = e && e.code || "";
    if(code === "auth/invalid-email") return "Adresse e-mail invalide.";
    if(code === "auth/user-not-found" || code === "auth/wrong-password" || code === "auth/invalid-credential") return "E-mail ou mot de passe incorrect.";
    if(code === "auth/too-many-requests") return "Trop de tentatives, réessaie dans quelques minutes.";
    if(code === "auth/network-request-failed") return "Pas de connexion internet.";
    return "Connexion impossible, réessaie.";
  }

  async function doLogin(){
    const email = document.getElementById('loginEmail').value.trim();
    const password = document.getElementById('loginPassword').value;
    const msg = document.getElementById('loginMsg');
    const btn = document.getElementById('btnLogin');
    if(!email || !password){
      msg.textContent = "Entre ton e-mail et ton mot de passe.";
      msg.className = "msg err";
      return;
    }
    btn.disabled = true;
    msg.textContent = "";
    try{
      await auth.signInWithEmailAndPassword(email, password);
    }catch(e){
      msg.textContent = authErrorMsg(e);
      msg.className = "msg err";
    }
    btn.disabled = false;
  }

  function doLogout(){
    if(unsub){ unsub(); unsub = null; }
    if(unsubAudit){ unsubAudit(); unsubAudit = null; }
    if(unsubPointage){ unsubPointage(); unsubPointage = null; }
    auth.signOut();
  }

  auth.onAuthStateChanged((user)=>{
    document.getElementById('loadingScreen').style.display = 'none';
    if(user){
      currentUserName = EMAIL_NAMES[user.email] || user.email.split("@")[0];
      document.getElementById('userBarName').textContent = currentUserName;
      document.getElementById('loginWrap').style.display = 'none';
      document.getElementById('appWrap').style.display = '';
      document.getElementById('loginEmail').value = "";
      document.getElementById('loginPassword').value = "";
      document.getElementById('loginMsg').textContent = "";
      startApp();
    } else {
      currentUserName = "";
      if(unsub){ unsub(); unsub = null; }
      if(unsubAudit){ unsubAudit(); unsubAudit = null; }
      if(unsubPointage){ unsubPointage(); unsubPointage = null; }
      document.getElementById('appWrap').style.display = 'none';
      document.getElementById('loginWrap').style.display = '';
    }
  });

  async function startApp(){
    renderNewForm();
    const status = document.getElementById('status');
    db = firebase.firestore();

    status.innerHTML = '<span class="pulse"></span>Connecté — synchronisé en temps réel';

    setInterval(()=>{
      if(document.getElementById('viewPlanning').style.display !== 'none' && planningDate === todayStr()){
        renderPlanning();
      }
    }, 60000);

    unsub = db.collection("rendezvous").orderBy("createdAt","desc").limit(1000).onSnapshot(
      (snap)=>{
        allDocs = snap.docs.map(d=>({id:d.id, ...d.data()}));
        if(document.getElementById('viewPlanning').style.display !== 'none') renderPlanning();
        if(document.getElementById('viewCa').style.display !== 'none') renderCa();
      },
      (err)=>{
        status.innerHTML = "Connexion perdue — recharge la page.";
      }
    );

    unsubAudit = db.collection("audit_log").orderBy("at","desc").limit(200).onSnapshot(
      (snap)=>{
        auditDocs = snap.docs.map(d=>({id:d.id, ...d.data()}));
        if(document.getElementById('viewCa').style.display !== 'none') renderCa();
      },
      (err)=>{}
    );

    unsubPointage = db.collection("pointages").orderBy("date","desc").limit(2000).onSnapshot(
      (snap)=>{
        pointageDocs = snap.docs.map(d=>({id:d.id, ...d.data()}));
        if(document.getElementById('viewPointage').style.display !== 'none') renderPointage();
      },
      (err)=>{}
    );
  }
</script>
</body>
</html>
